<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Limpiar YORI-TEX</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0d1b2a;
  color:#e8f0fe;
  font-family:system-ui,-apple-system,sans-serif;
  text-align:center;
  padding:24px;
}
.box{max-width:360px}
.logo{
  width:52px;
  height:52px;
  border-radius:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#f5a623;
  color:#0d1b2a;
  font-weight:900;
  margin-bottom:14px;
}
h1{font-size:20px;margin:0 0 8px}
p{color:#8fa8c8;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Y</div>
  <h1>Limpiando YORI-TEX...</h1>
  <p>Se borro el guardado de este navegador. Ahora la app cargara desde Google Sheets.</p>
</div>
<script>
(async function(){
  try {
    localStorage.removeItem('yoritex_local');
    sessionStorage.clear();
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch(e) {}
  setTimeout(function(){
    const destino = location.protocol === 'file:' ? 'index-fixed.html' : 'index.html';
    location.replace(destino + '?clean=' + Date.now());
  }, 900);
})();
</script>
</body>
</html>
